<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glass staff cards | Labs</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ink:#14305c;--muted:#51627f;--base:#14396f;--accent:#0c8f8b}
*{box-sizing:border-box}body{margin:0;background:#eef1f7;color:var(--ink);font:400 1rem/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f2f4f9}.orbs i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(70px);opacity:.34;animation:o 26s ease-in-out infinite alternate}.orbs i:nth-child(1){left:-14vmax;top:-10vmax;background:var(--base)}.orbs i:nth-child(2){right:-16vmax;top:20vh;background:var(--accent);animation-duration:34s}.orbs i:nth-child(3){left:24vw;bottom:-26vmax;background:#c7cfe0;animation-duration:30s}@keyframes o{to{transform:translate(9vmax,7vmax) scale(1.14)}}
.tools{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #dfe5ee}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}.bar b{font:800 1rem "Plus Jakarta Sans",sans-serif}.bar .sp{flex:1}#msg{font-size:.84rem;color:var(--muted)}
button.t{min-height:38px;border:1px solid #cfd8e4;border-radius:9px;background:#fff;color:var(--ink);font:600 .9rem Inter,sans-serif;padding:0 13px;cursor:pointer}button.t.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.set{display:none;max-height:62vh;overflow:auto;padding:4px 14px 14px;border-top:1px solid #e6ebf2}.set.on{display:block}.set h4{margin:12px 0 6px;font:700 .92rem "Plus Jakarta Sans",sans-serif}
.row{display:grid;grid-template-columns:minmax(120px,1.2fr) repeat(4,minmax(74px,1fr));gap:8px;align-items:center;padding:7px 0;border-top:1px solid #edf0f5;font-size:.86rem}.row.h{font-size:.74rem;color:var(--muted);border:0;padding:0}.row input[type=color]{width:42px;height:32px;padding:2px;border:1px solid #cfd8e4;border-radius:7px;background:#fff}.row input[type=checkbox]{width:19px;height:19px;accent-color:var(--base)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;font-size:.86rem}.ppl label{display:flex;justify-content:space-between;align-items:center;gap:8px}.ppl select{min-height:32px;border:1px solid #cfd8e4;border-radius:7px;background:#fff;font:inherit}
main{width:min(1200px,100%);margin:auto;padding:12px clamp(12px,3vw,28px) 60px}
section.s{padding:30px 0 12px}section.s h2{font:800 clamp(1.5rem,1.2rem + 1.5vw,2.3rem)/1.15 "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em;margin:0 0 4px;color:var(--ink)}section.s>p{margin:0 0 18px;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media(max-width:1020px){.g{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.g{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.c{position:relative;isolation:isolate;height:430px;border-radius:28px;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.26));-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:-1px 0 1px -.5px rgba(255,0,80,.35),1px 0 1px -.5px rgba(0,190,255,.45),0 28px 44px -28px rgba(15,30,70,.6);transition:transform .25s cubic-bezier(.2,.8,.2,1);will-change:transform}
.c::after,.fo::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:9;pointer-events:none;background:linear-gradient(150deg,#fff,rgba(255,255,255,.3) 42%,rgba(255,255,255,.2) 62%,#fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.c canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.top{position:absolute;left:20px;right:20px;top:20px}.top h3{margin:0 0 5px;font:800 1.34rem/1.14 "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.top p{margin:0;font-size:.82rem;font-weight:600;line-height:1.35;color:var(--sc);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);height:262px;max-width:96%;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(10,20,50,.3));z-index:1}
.ph.f{height:246px}.ph.real{width:176px;height:224px;object-fit:cover;object-position:50% 12%;border-radius:88px 88px 18px 18px;bottom:100px;-webkit-mask:linear-gradient(#000 76%,transparent);mask:linear-gradient(#000 76%,transparent);filter:none}
.cap{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;min-height:112px;padding:12px 14px;border-radius:20px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 66%,rgba(255,255,255,.2)),color-mix(in srgb,var(--tc) 46%,transparent));-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.42);display:flex;flex-direction:column;justify-content:space-between;gap:7px}
.cap b{font:700 .95rem/1.2 "Plus Jakarta Sans",sans-serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.6em;font-size:.9rem}
.pill{align-self:flex-start;min-height:30px;padding:0 13px;border-radius:99px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.1);color:#fff;font:600 .78rem Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.more{position:absolute;inset:0;z-index:6;padding:20px;display:none;flex-direction:column;gap:8px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);font-size:.9rem;overflow:auto}.c.open .more{display:flex}.more h3{margin:0;font:800 1.16rem "Plus Jakarta Sans",sans-serif}.more p{margin:0;color:var(--muted)}.more button{margin-top:auto;align-self:flex-start}
.txt{position:absolute;left:20px;right:20px;top:calc(20px + 4.2rem);font-size:.9rem;color:var(--muted);line-height:1.45}
/* Folder: the last widget of a section */
.fo{position:relative;height:430px;border-radius:28px;overflow:hidden;display:block;text-decoration:none;color:#fff;background:radial-gradient(90% 60% at 50% 34%,color-mix(in srgb,var(--fc) 72%,#fff 10%),color-mix(in srgb,var(--fc) 45%,#05070d) 62%,color-mix(in srgb,var(--fc) 18%,#05070d));box-shadow:0 28px 44px -28px rgba(15,30,70,.7);isolation:isolate}
.f3{position:absolute;left:50%;top:47%;width:76%;aspect-ratio:1/.8;transform:translate(-50%,-50%) rotate(-3deg);animation:fl 5s ease-in-out infinite;transition:transform .4s cubic-bezier(.2,.9,.3,1)}@keyframes fl{50%{translate:0 -8px}}
.bk{position:absolute;inset:0;border-radius:16px 22px 22px 22px;background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 80%,#fff 20%),color-mix(in srgb,var(--fc) 92%,#000))}.bk::before{content:"";position:absolute;left:0;top:-13%;width:44%;height:20%;border-radius:14px 22px 0 0;background:color-mix(in srgb,var(--fc) 80%,#fff 20%);clip-path:polygon(0 0,76% 0,100% 100%,0 100%)}
.pk{position:absolute;left:50%;bottom:30%;width:48%;aspect-ratio:3/4;margin-left:-24%;border-radius:12px;overflow:hidden;background:#fff;border:3px solid #0d1118;box-shadow:0 10px 20px -8px rgba(0,0,0,.7);transition:transform .4s cubic-bezier(.2,.9,.3,1);display:grid;place-items:center;color:var(--ink);font:800 .8rem/1.2 "Plus Jakarta Sans",sans-serif;text-align:center;padding:0}.pk img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}.pk.d img{object-fit:contain;object-position:50% 100%;background:color-mix(in srgb,var(--fc) 26%,#fff)}.pk span{padding:6px}
.pk.a{transform:translate(-42%,-2%) rotate(-14deg)}.pk.b{transform:translate(0,-16%)}.pk.c3{transform:translate(42%,-2%) rotate(14deg)}
.fr{position:absolute;left:-3%;right:-3%;bottom:-3%;height:72%;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 42%,rgba(255,255,255,.3)),color-mix(in srgb,var(--fc) 60%,transparent));-webkit-backdrop-filter:blur(9px) saturate(150%);backdrop-filter:blur(9px) saturate(150%);box-shadow:inset 0 0 0 1.3px rgba(255,255,255,.5),0 18px 26px -14px rgba(0,0,0,.6);display:flex;align-items:flex-end;padding:14px 16px}.fr b{font:800 1.05rem/1.1 "Plus Jakarta Sans",sans-serif}.fr small{display:block;margin-top:3px;font-size:.76rem;opacity:.86}
.ar{position:absolute;right:9%;bottom:7%;width:56px;height:56px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));animation:ar 2.6s ease-in-out infinite}@keyframes ar{50%{transform:translate(-5px,-5px)}}
@media(hover:hover){.fo:hover .f3{transform:translate(-50%,-52%) rotate(-1deg) scale(1.03)}.fo:hover .pk.a{transform:translate(-62%,-16%) rotate(-20deg)}.fo:hover .pk.b{transform:translate(0,-34%)}.fo:hover .pk.c3{transform:translate(62%,-16%) rotate(20deg)}}
@media(max-width:760px){.c,.fo{height:352px;border-radius:22px}.top{left:13px;right:13px;top:13px}.top h3{font-size:1.02rem}.top p{font-size:.72rem}.ph{height:190px;bottom:70px}.ph.f{height:186px}.ph.real{width:128px;height:158px;bottom:92px}.cap{left:7px;right:7px;bottom:7px;padding:9px 10px;min-height:100px;border-radius:15px}.cap b{font-size:.76rem}.pill{min-height:27px;padding:0 10px;font-size:.72rem}.txt{left:13px;right:13px;top:calc(13px + 3.4rem);font-size:.78rem}.f3{width:82%}.fr b{font-size:.92rem}.ar{width:42px;height:42px}}
@media(prefers-reduced-motion:reduce){.orbs i,.f3,.ar{animation:none}.c{transition:none}}

/* Live tiles: colour drifts through a soft field, then bevelled glass squares sit on top. The pointer pulls the colour. */
function mk(el){const cv=el.querySelector('canvas'),g=cv.getContext('2d'),o={el,cv,g,sec:el.dataset.sec,vis:true,px:.5,py:.75,tx:.5,ty:.75,seed:Math.random()*100};o.io=new IntersectionObserver(([x])=>o.vis=x.isIntersecting,{rootMargin:'60px'});o.io.observe(el);if(matchMedia('(hover:hover)').matches){el.addEventListener('pointermove',ev=>{const r=el.getBoundingClientRect();o.tx=(ev.clientX-r.left)/r.width;o.ty=(ev.clientY-r.top)/r.height;el.style.transform=`perspective(800px) rotateX(${(.5-o.ty)*5}deg) rotateY(${(o.tx-.5)*6}deg)`});el.addEventListener('pointerleave',()=>{o.tx=.5;o.ty=.75;el.style.transform=''})}size(o);return o}
function size(o){const r=o.el.getBoundingClientRect(),w=o.el.offsetWidth,h=o.el.offsetHeight,d=Math.min(devicePixelRatio||1,1.5);o.w=w;o.h=h;o.d=d;o.cv.width=w*d;o.cv.height=h*d;o.cell=w<200?30:42;o.nx=Math.ceil(w/o.cell);o.ny=Math.ceil(h/o.cell);o.off=document.createElement('canvas');o.off.width=o.nx;o.off.height=o.ny;o.og=o.off.getContext('2d');o.img=o.og.createImageData(o.nx,o.ny);o.st=Array.from({length:o.nx},(_,i)=>Math.round(o.ny*(.46+.1*Math.sin(i*1.9+o.seed)+.05*Math.sin(i*4.3+o.seed*2))));o.bev=bevel(o.cell,d)}
function bevel(c,d){const s=document.createElement('canvas'),p=c*d;s.width=s.height=p;const g=s.getContext('2d'),r=8*d,i=1.2*d,gr=g.createLinearGradient(0,0,p,p);gr.addColorStop(0,'rgba(255,255,255,.34)');gr.addColorStop(.5,'rgba(255,255,255,.06)');gr.addColorStop(1,'rgba(255,255,255,.2)');g.beginPath();g.roundRect(i,i,p-2*i,p-2*i,r);g.fillStyle=gr;g.fill();g.lineWidth=1.2*d;const e2=g.createLinearGradient(0,0,p,p);e2.addColorStop(0,'rgba(255,255,255,.75)');e2.addColorStop(.5,'rgba(255,255,255,.14)');e2.addColorStop(1,'rgba(255,255,255,.5)');g.strokeStyle=e2;g.stroke();return s}
function drawCard(o,t){const c=hex(tile(o.sec)),acc=hex(C.theme.accent),deep=c,mid=mixc(c,acc,.42),pale=mixc(c,[255,255,255],.72);o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;const{nx,ny,img:im,st}=o,D=im.data,sd=o.seed,bx=.5+.3*Math.sin(t*.42+sd),by=.78+.13*Math.cos(t*.33+sd),cx=.25+.5*Math.sin(t*.27+sd*2)**2,cy=.92+.08*Math.sin(t*.5);
 for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const u=(x+.5)/nx,v=(y+.5)/ny,d1=(u-bx)**2*1.5+(v-by)**2*3,d2=(u-cx)**2*2+(v-cy)**2*5,d3=(u-o.px)**2*3+(v-o.py)**2*5,f=Math.min(1,1.05*Math.exp(-d1*5.5)+.55*Math.exp(-d2*7)+.75*Math.exp(-d3*9)),on=y>=st[x],col=mixc(mixc(pale,mid,Math.min(1,f*1.9)),deep,Math.max(0,f*1.35-.35)),a=on?.72+.28*f:0,i=(y*nx+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=a*255}
 o.og.putImageData(im,0,0);const g=o.g,W=o.cv.width,H=o.cv.height,p=o.cell*o.d;g.clearRect(0,0,W,H);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(o.off,0,0,nx*p,ny*p);for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){if(y<st[x]-1)continue;const edge=y<st[x];g.globalAlpha=edge?.5:.45+.4*(.5+.5*Math.sin(t*.9+x*1.7+y*2.3+sd));g.drawImage(o.bev,x*p,y*p)}g.globalAlpha=1}
let last=0,still=matchMedia('(prefers-reduced-motion: reduce)').matches;function loop(n){requestAnimationFrame(loop);if(n-last<33)return;last=n;const t=n/1000;cards.forEach(o=>{if(o.vis)drawCard(o,t)})}
function redrawOnce(){cards.forEach(o=>drawCard(o,3))}
addEventListener('resize',()=>{cards.forEach(size);if(still)redrawOnce()});

$('#set').addEventListener('input',ev=>{const t=ev.target,d=t.dataset;if(d.s){const c=cfg(d.s);c[d.k]=t.type==='checkbox'?t.checked:t.value;if(d.k==='tile')document.querySelectorAll(`.c[data-sec="${d.s}"]`).forEach(x=>x.style.setProperty('--tc',t.value));else paint();if(still)redrawOnce()}else if(d.p){S.photo[d.p]=t.value;paint();if(still)redrawOnce()}});

(async()=>{try{if(P!==window&&P.FA)C=await P.FA.content()}catch{}if(!C){await loadScript('/assets/defaults.js');C=window.FA_DEFAULTS}document.documentElement.style.setProperty('--base',C.theme.base);document.documentElement.style.setProperty('--accent',C.theme.accent);document.documentElement.style.setProperty('--sc',C.theme.accent);try{const c=P.FA_CONFIG;if(c&&c.url){const r=await fetch(`${c.url}/rest/v1/site_sections?select=data&key=eq.${KEY}`,{headers:{apikey:c.anon,authorization:'Bearer '+c.anon}}),a=await r.json();if(a[0]&&a[0].data)S=Object.assign(S,a[0].data)}}catch{}S.sections=S.sections||{};S.photo=S.photo||{};build();settings();paint();if(still)redrawOnce();else requestAnimationFrame(loop)})();

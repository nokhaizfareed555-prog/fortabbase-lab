<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labs | Fort Abbas Poly Clinic</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="/labs/labs.css"></head>
<body><header class="lb-top"><div class="lb-w"><a href="/labs">Labs</a><a class="r" href="/">Back to the site</a></div></header>
<main class="lb-w"><div class="lb-hd"><h1>Labs</h1><p>A place to look at new sections, widgets and pages before they go on the website. Nothing here appears on the public site or in search results until it is moved there.</p></div>
<div id="out"></div></main>
<script>
/* To add an experiment: add one line here and put its page in web/labs/. Groups: Sections, Widgets, Pages. */
const LABS=[
 {group:"Sections",title:"Sample vial",href:"/labs/sample-vial",status:"In testing",text:"A scroll story: tube, cap, label, sample, sealing and a new-test notification, on a live wall of moving cubes."},
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("out").innerHTML=["Sections","Widgets","Pages"].map(g=>{const a=LABS.filter(x=>x.group===g);return '<section class="lb-sec"><h2>'+g+'</h2>'+(a.length?'<div class="lb-g">'+a.map(x=>'<a class="lb-c" href="'+esc(x.href)+'"><span class="lb-tag">'+esc(x.status)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p><span class="lb-go">Open</span></a>').join("")+'</div>':'<div class="lb-empty">Nothing here yet.</div>')+'</section>'}).join("");
</script></body></html>
